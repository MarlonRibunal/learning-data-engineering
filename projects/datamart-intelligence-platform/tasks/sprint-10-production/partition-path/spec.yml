title: "Production: build a partition path"
order: 5
submission_path: submissions/production/partition_path.py
scaffold: scaffold/partition_path.py
solution: solution/partition_path.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: builds a Hive-style partition path
    entry: partition_path
    args: [orders, "2026-03-01"]
    expect: "orders/year=2026/month=03/day=01"
    hints:
      - >-
        Partition paths must be <em>deterministic</em> so the same date always
        lands in the same directory — the ISO <code>date</code> packs the year,
        month, and day you need as separate pieces. What character separates them?
      - >-
        Split <code>date</code> on <code>-</code> to get year, month, and day,
        then assemble a Hive-style path like
        <code>table/year=YYYY/month=MM/day=DD</code> — keep the input's
        zero-padding so March stays <code>03</code>.
      - >-
        Do <code>year, month, day = date.split("-")</code> and return
        <code>f"{table}/year={year}/month={month}/day={day}"</code>; for
        <code>orders</code> and <code>2026-03-01</code> that's
        <code>orders/year=2026/month=03/day=01</code>.
