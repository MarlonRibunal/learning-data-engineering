title: "Hybrid cloud: gate downstream on all successes"
order: 6
submission_path: submissions/hybrid/all_succeeded.py
scaffold: scaffold/all_succeeded.py
solution: solution/all_succeeded.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: proceeds only when every job succeeded
    entry: all_succeeded
    args:
      - [SUCCESS, SUCCESS]
    expect: true
    hints:
      - >-
        You should only proceed when <em>every</em> job succeeded — a single
        non-<code>SUCCESS</code> status has to gate the whole batch. Which
        Python builtin returns <code>True</code> only when a condition holds for
        all items?
      - >-
        <code>all(...)</code> is <code>True</code> only when every element
        passes, so feed it a generator that checks each status against the
        success state: <code>all(s == "SUCCESS" for s in statuses)</code>.
      - >-
        Return <code>all(s == "SUCCESS" for s in statuses)</code>; for
        <code>[SUCCESS, SUCCESS]</code> every status is <code>SUCCESS</code>, so
        it returns <code>true</code>.
