title: "Spark: select and filter a DataFrame"
order: 1
submission_path: submissions/spark/select_and_filter.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: returns order_id and amount for the big orders
    entry: transform
    inputs:
      orders:
        - {order_id: 1, customer_id: 10, category: Electronics, amount: 100}
        - {order_id: 2, customer_id: 11, category: Books, amount: 20}
        - {order_id: 3, customer_id: 10, category: Electronics, amount: 40}
        - {order_id: 4, customer_id: 12, category: Home, amount: 60}
    expect:
      - {order_id: 1, amount: 100}
      - {order_id: 4, amount: 60}
    hints:
      - >-
        You need two things here: only the orders whose <code>amount</code> is
        at least 50, and only the <code>order_id</code> and <code>amount</code>
        columns. Are you both <em>filtering rows</em> and <em>narrowing
        columns</em>?
      - >-
        <code>.filter(...)</code> keeps rows that match a condition, while
        <code>.select(...)</code> picks which columns survive. Write the
        condition against a column, e.g. <code>orders.amount >= 50</code>.
      - >-
        Put it together:
        <code>orders.filter(orders.amount >= 50).select("order_id", "amount")</code>.
        Only orders 1 (100) and 4 (60) clear the threshold; 20 and 40 drop out.
