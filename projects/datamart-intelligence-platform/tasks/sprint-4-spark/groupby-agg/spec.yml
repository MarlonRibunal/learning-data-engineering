title: "Spark: aggregate revenue by category"
order: 2
submission_path: submissions/spark/groupby_agg.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: sums revenue per category
    entry: transform
    inputs:
      orders:
        - {order_id: 1, customer_id: 10, category: Electronics, amount: 100}
        - {order_id: 2, customer_id: 11, category: Books, amount: 20}
        - {order_id: 3, customer_id: 10, category: Electronics, amount: 40}
        - {order_id: 4, customer_id: 12, category: Home, amount: 60}
    expect:
      - {category: Electronics, revenue: 140}
      - {category: Books, revenue: 20}
      - {category: Home, revenue: 60}
    hints:
      - >-
        You're collapsing many order rows into one total per
        <code>category</code>. Which method groups rows by a key, and how do you
        make the summed column come out named <code>revenue</code>?
      - >-
        Use <code>.groupBy("category").agg(...)</code> and sum inside the agg
        with <code>F.sum("amount")</code>. That column defaults to the name
        <code>sum(amount)</code> — rename it with <code>.alias("revenue")</code>.
      - >-
        Put it together:
        <code>orders.groupBy("category").agg(F.sum("amount").alias("revenue"))</code>.
        Electronics sums 100 + 40 = <code>140</code>, Books 20, Home 60.
