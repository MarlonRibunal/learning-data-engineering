title: "Spark: keep the latest record per key"
order: 6
submission_path: submissions/spark/dedupe_latest.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: keeps only the newest row per id
    entry: transform
    inputs:
      events:
        - {id: 1, ts: "2026-01-01 09:00:00", v: a}
        - {id: 1, ts: "2026-01-01 10:00:00", v: b}
        - {id: 2, ts: "2026-01-01 09:00:00", v: c}
    expect:
      - {id: 1, v: b}
      - {id: 2, v: c}
    hints:
      - >-
        For each <code>id</code> you want exactly one row — the most recent by
        <code>ts</code>. How would you number the rows <em>within each id</em>,
        newest first, and then keep only the top one?
      - >-
        Cast the string first with <code>F.to_timestamp("ts")</code>, then
        number rows in a descending window:
        <code>Window.partitionBy("id").orderBy(F.to_timestamp("ts").desc())</code>
        with <code>F.row_number().over(w)</code>. Keep the rows where that number
        is 1.
      - >-
        Put it together:
        <code>w = Window.partitionBy("id").orderBy(F.to_timestamp("ts").desc())</code>,
        then
        <code>events.withColumn("rn", F.row_number().over(w)).filter(F.col("rn") == 1).select("id", "v")</code>.
        Id 1's 10:00 row wins, so <code>v = b</code>.
