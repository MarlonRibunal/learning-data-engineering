        - {order_id: 4, customer_id: 12, category: Home, amount: 60}
    expect:
      - {customer_id: 10, Books: 0, Electronics: 140, Home: 0}
      - {customer_id: 11, Books: 20, Electronics: 0, Home: 0}
      - {customer_id: 12, Books: 0, Electronics: 0, Home: 60}
