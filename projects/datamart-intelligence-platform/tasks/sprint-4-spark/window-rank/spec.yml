title: "Spark: rank within groups (window function)"
order: 5
submission_path: submissions/spark/window_rank.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: ranks orders by amount within each category
    entry: transform
    inputs:
      orders:
        - {order_id: 1, customer_id: 10, category: Electronics, amount: 100}
        - {order_id: 2, customer_id: 11, category: Books, amount: 20}
        - {order_id: 3, customer_id: 10, category: Electronics, amount: 40}
        - {order_id: 4, customer_id: 12, category: Home, amount: 60}
    expect:
      - {order_id: 2, category: Books, rank: 1}
      - {order_id: 1, category: Electronics, rank: 1}
      - {order_id: 3, category: Electronics, rank: 2}
      - {order_id: 4, category: Home, rank: 1}
    hints:
      - >-
        You want each order's standing <em>within</em> its <code>category</code>,
        biggest <code>amount</code> first — but every order row must survive. A
        plain <code>groupBy</code> collapses rows; what kind of function ranks
        without collapsing?
      - >-
        A <em>window function</em> ranks per group while keeping every row.
        Build a window with
        <code>Window.partitionBy("category").orderBy(F.col("amount").desc())</code>
        and apply <code>F.rank().over(w)</code>. Descending so the largest is
        rank 1.
      - >-
        Put it together:
        <code>w = Window.partitionBy("category").orderBy(F.col("amount").desc())</code>,
        then
        <code>orders.withColumn("rank", F.rank().over(w)).select("order_id", "category", "rank")</code>.
        In Electronics, 100 is rank 1 and 40 is rank 2.
