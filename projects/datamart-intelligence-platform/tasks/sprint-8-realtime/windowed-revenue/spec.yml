title: "Real-time: revenue per 10-minute window"
order: 2
submission_path: submissions/realtime/windowed_revenue.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: sums amount in each tumbling 10-minute window
    entry: transform
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", category: A, amount: 10}
        - {ts: "2026-01-01 09:07:00", category: B, amount: 20}
        - {ts: "2026-01-01 09:12:00", category: A, amount: 30}
        - {ts: "2026-01-01 09:18:00", category: A, amount: 5}
        - {ts: "2026-01-01 09:25:00", category: B, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", revenue: 30}
      - {window_start: "2026-01-01 09:10:00", revenue: 35}
      - {window_start: "2026-01-01 09:20:00", revenue: 15}
    hints:
      - >-
        Counting rows isn't the same as adding up money. You want the total
        <code>amount</code> inside each 10-minute bucket. Which aggregation
        turns many rows into one summed total?
      - >-
        After casting <code>ts</code> and grouping by
        <code>F.window("ts", "10 minutes")</code>, aggregate with
        <code>F.sum("amount").alias("revenue")</code> inside an
        <code>.agg(...)</code> call.
      - >-
        Use
        <code>.agg(F.sum("amount").alias("revenue"))</code>, then select
        <code>F.col("window.start").cast("string").alias("window_start")</code>
        and <code>revenue</code>. The 09:00 window sums 10 + 20 =
        <code>revenue: 30</code>.
