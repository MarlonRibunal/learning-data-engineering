title: "Real-time: average order value per window"
order: 7
submission_path: submissions/realtime/windowed_average.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: averages amount in each 10-minute window
    entry: transform
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", category: A, amount: 10}
        - {ts: "2026-01-01 09:07:00", category: B, amount: 20}
        - {ts: "2026-01-01 09:12:00", category: A, amount: 30}
        - {ts: "2026-01-01 09:18:00", category: A, amount: 5}
        - {ts: "2026-01-01 09:25:00", category: B, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", avg_amount: 15.0}
      - {window_start: "2026-01-01 09:10:00", avg_amount: 17.5}
      - {window_start: "2026-01-01 09:20:00", avg_amount: 15.0}
    hints:
      - >-
        You need the mean <code>amount</code> per 10-minute window, reported to
        two decimal places. Which aggregate gives an average, and how do you keep
        the result from trailing off into extra digits?
      - >-
        Combine two functions inside <code>.agg(...)</code>:
        <code>F.round(F.avg("amount"), 2)</code>, aliased as
        <code>avg_amount</code>, after grouping by
        <code>F.window("ts", "10 minutes")</code>.
      - >-
        Use
        <code>.agg(F.round(F.avg("amount"), 2).alias("avg_amount"))</code> and
        select <code>window.start</code> as <code>window_start</code>. The 09:00
        window averages (10 + 20) / 2 = <code>avg_amount: 15.0</code>.
