        - {ts: "2026-01-01 09:18:00", category: A, amount: 5}
        - {ts: "2026-01-01 09:25:00", category: B, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", categories: 2}
      - {window_start: "2026-01-01 09:10:00", categories: 1}
      - {window_start: "2026-01-01 09:20:00", categories: 1}
