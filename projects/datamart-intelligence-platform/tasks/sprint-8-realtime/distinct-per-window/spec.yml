title: "Real-time: distinct categories per window"
order: 5
submission_path: submissions/realtime/distinct_per_window.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: counts distinct categories in each window
    entry: transform
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", category: A, amount: 10}
        - {ts: "2026-01-01 09:07:00", category: B, amount: 20}
        - {ts: "2026-01-01 09:12:00", category: A, amount: 30}
        - {ts: "2026-01-01 09:18:00", category: A, amount: 5}
        - {ts: "2026-01-01 09:25:00", category: B, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", categories: 2}
      - {window_start: "2026-01-01 09:10:00", categories: 1}
      - {window_start: "2026-01-01 09:20:00", categories: 1}
    hints:
      - >-
        You're counting <em>how many different</em> categories appear per
        window, not how many events. A plain count would report total rows —
        what counts only the unique <code>category</code> values?
      - >-
        Inside <code>.agg(...)</code>, use
        <code>F.countDistinct("category").alias("categories")</code> after
        grouping by <code>F.window("ts", "10 minutes")</code>.
      - >-
        Group by <code>F.window("ts", "10 minutes")</code>, then
        <code>.agg(F.countDistinct("category").alias("categories"))</code> and
        select <code>window.start</code> as <code>window_start</code>. The 09:00
        window sees both A and B, so <code>categories: 2</code>.
