title: "Real-time: a real Structured Streaming query"
order: 9
submission_path: submissions/realtime/structured_streaming.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark_streaming
    name: streams events into watermarked 10-minute windows
    entry: stream_transform
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", amount: 10}
        - {ts: "2026-01-01 09:07:00", amount: 20}
        - {ts: "2026-01-01 09:12:00", amount: 30}
        - {ts: "2026-01-01 09:18:00", amount: 5}
        - {ts: "2026-01-01 09:25:00", amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", count: 2}
      - {window_start: "2026-01-01 09:10:00", count: 2}
      - {window_start: "2026-01-01 09:20:00", count: 1}
    hints:
      - >-
        Two things are off in the scaffold's streaming aggregation: the window is
        the wrong size for these expected buckets, and a real stream needs a
        bound on how long to wait for late events. What tells Spark when a window
        is safe to finalize?
      - >-
        Widen the window to <code>F.window("ts", "10 minutes")</code>, and before
        grouping add a watermark:
        <code>.withWatermark("ts", "10 minutes")</code> so late data past the
        threshold is dropped and state can be released.
      - >-
        After casting <code>ts</code>, chain
        <code>.withWatermark("ts", "10 minutes").groupBy(F.window("ts", "10 minutes")).count()</code>,
        then select <code>window.start</code> as <code>window_start</code>. The
        09:03 and 09:07 events land in the 09:00 window for <code>count: 2</code>.
