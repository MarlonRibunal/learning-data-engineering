title: "Real-time: biggest order per window"
order: 8
submission_path: submissions/realtime/windowed_max.py
scaffold: scaffold/transform.py
solution: solution/transform.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark
    name: finds the max amount in each window
    entry: transform
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", category: A, amount: 10}
        - {ts: "2026-01-01 09:07:00", category: B, amount: 20}
        - {ts: "2026-01-01 09:12:00", category: A, amount: 30}
        - {ts: "2026-01-01 09:18:00", category: A, amount: 5}
        - {ts: "2026-01-01 09:25:00", category: B, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", max_amount: 20}
      - {window_start: "2026-01-01 09:10:00", max_amount: 30}
      - {window_start: "2026-01-01 09:20:00", max_amount: 15}
    hints:
      - >-
        The biggest order per window isn't a sum or a count — it's the single
        largest <code>amount</code> in each bucket. Which aggregate returns the
        maximum value of a column?
      - >-
        Inside <code>.agg(...)</code>, use
        <code>F.max("amount").alias("max_amount")</code> after grouping by
        <code>F.window("ts", "10 minutes")</code>.
      - >-
        Use
        <code>.agg(F.max("amount").alias("max_amount"))</code> and select
        <code>window.start</code> as <code>window_start</code>. The 09:00 window
        holds amounts 10 and 20, so <code>max_amount: 20</code>.
