title: "On-call: triage the freshness alerts"
order: 1
submission_path: submissions/oncall/triage.py
scaffold: scaffold/triage.py
solution: solution/triage.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: flags only the tables past their SLA
    entry: stale_tables
    args:
      - - {name: orders, age_min: 5}
        - {name: payments, age_min: 90}
        - {name: users, age_min: 200}
      - 60
    expect: [payments, users]
    hints:
      - >-
        A table is <em>stale</em> only when it has sat longer than the SLA
        allows. Compare each table's <code>age_min</code> against
        <code>sla_minutes</code> — and notice the expected list is sorted.
      - >-
        Walk the <code>tables</code> and keep a table's <code>name</code> when
        <code>age_min &gt; sla_minutes</code>, then sort the surviving names.
      - >-
        Return <code>sorted(t["name"] for t in tables if t["age_min"] &gt;
        sla_minutes)</code>; with an SLA of 60, only payments (90) and users
        (200) exceed it, giving <code>[payments, users]</code>.
