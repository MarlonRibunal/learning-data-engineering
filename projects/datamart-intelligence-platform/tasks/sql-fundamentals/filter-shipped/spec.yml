title: Filter to shipped orders
order: 2
submission_path: submissions/sql-fundamentals/filter_shipped.sql
scaffold: scaffold/filter_shipped.sql
solution: solution/filter_shipped.sql

checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: file_contains
    name: uses SELECT
    pattern: "(?is)select\\b"
    hint: "start with SELECT"
  - type: file_contains
    name: reads from the orders table
    pattern: "(?is)from\\s+orders\\b"
    hint: "SELECT ... FROM orders"
  - type: file_contains
    name: filters with WHERE
    pattern: "(?is)\\bwhere\\b"
    hint: "narrow the rows with a WHERE clause"
  - type: file_contains
    name: keeps only shipped orders
    pattern: "(?is)status\\s*=\\s*'shipped'"
    hint: "WHERE status = 'shipped'"
