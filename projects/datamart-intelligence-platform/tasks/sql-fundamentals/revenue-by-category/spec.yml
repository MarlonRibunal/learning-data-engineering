title: Revenue by product category
# Where the learner's work lives, relative to the repo root. `check start` copies
# the scaffold here; `check` grades whatever the learner leaves here.
submission_path: submissions/sql-fundamentals/revenue_by_category.sql
scaffold: scaffold/revenue_by_category.sql
solution: solution/revenue_by_category.sql

# Milestone-1 tasks use cheap file checks (no running stack needed). Later
# sprints add sql_assert / dbt_test / airflow checks that run against the stack.
checks:
  - type: file_exists
    name: submission exists and is non-empty

  - type: file_contains
    name: selects columns
    pattern: "(?is)select\\b"
    hint: "start with a SELECT statement"

  - type: file_contains
    name: reads from the orders table
    pattern: "(?is)from\\s+orders\\b"
    hint: "the revenue lives in the orders table — SELECT ... FROM orders"

  - type: file_contains
    name: aggregates revenue with SUM
    pattern: "(?is)sum\\s*\\("
    hint: "total the revenue with an aggregate, e.g. SUM(amount)"

  - type: file_contains
    name: groups by category
    pattern: "(?is)group\\s+by\\s+.*categor"
    hint: "one row per category means GROUP BY category"
