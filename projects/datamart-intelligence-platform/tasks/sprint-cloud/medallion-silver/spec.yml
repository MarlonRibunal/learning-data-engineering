title: "Lakehouse: bronze to silver"
order: 3
submission_path: submissions/cloud/to_silver.py
scaffold: scaffold/to_silver.py
solution: solution/to_silver.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: cleans bronze into silver
    entry: to_silver
    args:
      - - {id: 1, value: a}
        - {id: 1, value: b}
        - {id: 2, value: null}
        - {id: 3, value: c}
    expect:
      - {id: 1, value: b}
      - {id: 3, value: c}
    hints:
      - >-
        Silver refines bronze: keep only the <em>latest</em> row per
        <code>id</code>, then drop any row whose <code>value</code> is null.
        Notice id 1 appears twice and id 2 is null — which survives?
      - >-
        Collapse to the latest per id by overwriting into a dict while iterating
        in order — <code>latest[row["id"]] = row</code> — so the last write per
        id wins. Then emit ids in sorted order, skipping null values.
      - >-
        Return <code>[latest[k] for k in sorted(latest) if latest[k]["value"] is
        not None]</code>. For the sample id 1 keeps <code>b</code>, id 2 is
        dropped for being null, giving <code>expect</code>.
