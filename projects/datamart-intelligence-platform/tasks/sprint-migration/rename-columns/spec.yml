title: "Migration: map old columns to new"
order: 1
submission_path: submissions/migration/rename_keys.py
scaffold: scaffold/rename_keys.py
solution: solution/rename_keys.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: renames keys per the mapping
    entry: rename_keys
    args:
      - - {cust: 1, amt: 100}
      - {cust: customer_id, amt: amount}
    expect:
      - {customer_id: 1, amount: 100}
    hints:
      - >-
        It's the dictionary <em>keys</em> that change, not the values. For each
        row, what does <code>mapping</code> say the new name of each old key
        should be — and what should happen to a key that isn't in the mapping?
      - >-
        Rebuild each row with a dict comprehension, looking up every key in the
        mapping and falling back to the key itself: <code>mapping.get(k, k)</code>.
        That keeps unmapped keys intact instead of dropping them.
      - >-
        Return <code>[{mapping.get(k, k): v for k, v in row.items()} for row in
        rows]</code>; here <code>cust</code>→<code>customer_id</code> and
        <code>amt</code>→<code>amount</code>, giving <code>[{customer_id: 1, amount: 100}]</code>.
