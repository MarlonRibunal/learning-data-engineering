title: A read-only analyst role
order: 1
submission_path: submissions/security/read_only_analyst.sql
scaffold: scaffold/read_only_analyst.sql
solution: solution/read_only_analyst.sql
reseed: projects/datamart-intelligence-platform/seeds/security_seed.sql
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: sql_ingest
    name: analyst can read but not write
    asserts:
      - query: "SELECT has_table_privilege('analyst', 'analytics.customer_pii', 'SELECT')::int"
        equals: 1
        hint: "GRANT SELECT ON analytics.customer_pii TO analyst"
      - query: "SELECT has_table_privilege('analyst', 'analytics.customer_pii', 'INSERT')::int"
        equals: 0
        hint: "least privilege: the analyst must NOT be able to write"
    hints:
      - >-
        The role exists but was granted nothing, so it cannot even read. Least
        privilege means giving exactly read access and no more — what two grants
        let the analyst SELECT without being able to write?
      - >-
        The analyst needs <code>USAGE</code> on the schema to reach the table,
        then only SELECT on it — never INSERT/UPDATE/DELETE. <code>GRANT SELECT
        ON analytics.customer_pii TO analyst</code> reads; withholding write
        privileges keeps INSERT denied.
      - >-
        Add <code>GRANT USAGE ON SCHEMA analytics TO analyst;</code> and
        <code>GRANT SELECT ON analytics.customer_pii TO analyst;</code> — SELECT
        allowed, INSERT still 0.
