title: "Capstone: the Incident Response Gauntlet"
submission_path: submissions/capstone/incident_response.py
scaffold: scaffold/incident_response.py
solution: solution/incident_response.py

# Composite: one deliverable that runs the full incident playbook end to end —
# detect, diagnose, quantify the business impact, and verify recovery.
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: "detect — which tables breached SLA"
    entry: breached_tables
    args:
      - - {name: orders, age_min: 5}
        - {name: payments, age_min: 90}
        - {name: users, age_min: 200}
      - 60
    expect: [payments, users]
  - type: pyfunc
    name: "diagnose — the root-cause job"
    entry: root_cause
    args:
      - - {job: extract, status: success}
        - {job: transform, status: failed}
        - {job: load, status: failed}
    expect: transform
  - type: pyfunc
    name: "quantify — the revenue overstated by the bug"
    entry: revenue_impact
    args:
      - - {amount: 100, status: paid}
        - {amount: 50, status: paid}
        - {amount: 30, status: refunded}
    expect: 30
  - type: pyfunc
    name: "verify — is the incident recoverable yet"
    entry: is_recovered
    args:
      - {orders: 100, users: 50}
      - {orders: 100, users: 48}
    expect: false

proof:
  title: "Incident Response Gauntlet"
  summary: >
    A production incident, run end to end: detect which tables breached their
    freshness SLA, diagnose the root-cause job, quantify the revenue the bug
    overstated, and verify whether the recovery reconciled. The full on-call
    playbook, in code.
  pipeline: |
    🔔 alert ──detect──▶ breached tables ──diagnose──▶ root-cause job ──quantify──▶ $ impact ──verify──▶ recovered?
