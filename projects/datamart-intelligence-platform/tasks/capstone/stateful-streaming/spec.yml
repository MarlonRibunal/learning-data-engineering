title: "Capstone: the Stateful Streaming Monitor"
submission_path: submissions/capstone/streaming_pipeline.py
scaffold: scaffold/streaming_pipeline.py
solution: solution/streaming_pipeline.py

# Composite: one deliverable, three REAL Spark Structured Streaming queries.
# Each is a watermarked, stateful windowed aggregation — the grader opens a
# streaming source, runs your query with trigger(availableNow), and checks the
# streamed result.
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: spark_streaming
    name: "stage 1 — windowed revenue (stateful sum)"
    entry: windowed_revenue
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", user: a, amount: 10}
        - {ts: "2026-01-01 09:07:00", user: b, amount: 20}
        - {ts: "2026-01-01 09:12:00", user: a, amount: 30}
        - {ts: "2026-01-01 09:18:00", user: a, amount: 5}
        - {ts: "2026-01-01 09:25:00", user: b, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", revenue: 30}
      - {window_start: "2026-01-01 09:10:00", revenue: 35}
      - {window_start: "2026-01-01 09:20:00", revenue: 15}
    hints:
      - >-
        The scaffold buckets events into <em>5-minute</em> windows, yet the
        expected results start at 09:00, 09:10 and 09:20 — ten minutes apart.
        And a stateful streaming sum needs a bound on how long it waits for late
        events. What window duration, and what late-data cutoff, does this query
        actually need?
      - >-
        A windowed streaming aggregation must declare a watermark <em>before</em>
        it groups: <code>.withWatermark("ts", "10 minutes")</code> then
        <code>.groupBy(F.window("ts", "10 minutes"))</code>. The window size is
        what decides which 10-minute bucket each event's <code>amount</code>
        lands in.
      - >-
        Watermark <code>ts</code> at 10 minutes, group by
        <code>F.window("ts", "10 minutes")</code>, and aggregate with
        <code>F.sum("amount").alias("revenue")</code>. Over these events that
        yields 09:00 → 30, 09:10 → 35, 09:20 → 15.
  - type: spark_streaming
    name: "stage 2 — active users per window (stateful distinct)"
    entry: active_users
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", user: a, amount: 10}
        - {ts: "2026-01-01 09:07:00", user: b, amount: 20}
        - {ts: "2026-01-01 09:12:00", user: a, amount: 30}
        - {ts: "2026-01-01 09:18:00", user: a, amount: 5}
        - {ts: "2026-01-01 09:25:00", user: b, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:00:00", active_users: 2}
      - {window_start: "2026-01-01 09:10:00", active_users: 1}
      - {window_start: "2026-01-01 09:20:00", active_users: 1}
    hints:
      - >-
        The scaffold counts every event in the window, so the 09:10 bucket —
        where user <em>a</em> transacts twice — reports 2, but the expected
        <code>active_users</code> there is 1. Are you being asked for the number
        of rows, or the number of <em>distinct</em> users?
      - >-
        You want a distinct count of users per window, not a row count. In a
        streaming aggregation that is <code>F.approx_count_distinct("user")</code>
        rather than <code>F.count("*")</code>.
      - >-
        Swap the aggregate for
        <code>F.approx_count_distinct("user").alias("active_users")</code>,
        keeping the 10-minute watermarked window. That produces 09:00 → 2,
        09:10 → 1, 09:20 → 1.
  - type: spark_streaming
    name: "stage 3 — peak-revenue window (alert)"
    entry: peak_window
    inputs:
      events:
        - {ts: "2026-01-01 09:03:00", user: a, amount: 10}
        - {ts: "2026-01-01 09:07:00", user: b, amount: 20}
        - {ts: "2026-01-01 09:12:00", user: a, amount: 30}
        - {ts: "2026-01-01 09:18:00", user: a, amount: 5}
        - {ts: "2026-01-01 09:25:00", user: b, amount: 15}
    expect:
      - {window_start: "2026-01-01 09:10:00", revenue: 35}
    hints:
      - >-
        The scaffold emits every window, but this alert should surface only
        <em>one</em> — the 09:10 window at 35. Once you have per-window revenue,
        how do you keep just the single highest-revenue row?
      - >-
        Sort the windowed revenues so the largest comes first, then take only
        that top row: <code>.orderBy(F.col("revenue").desc())</code> followed by
        <code>.limit(1)</code>.
      - >-
        After the watermarked, windowed <code>F.sum("amount").alias("revenue")</code>,
        chain <code>.orderBy(F.col("revenue").desc()).limit(1)</code>. The peak
        is 09:10 → 35.

proof:
  title: "Stateful Streaming Monitor"
  summary: >
    A real Spark Structured Streaming pipeline: an unbounded event stream is
    aggregated into watermarked, stateful windows — revenue and active users
    per window — and scanned for the peak-revenue window. Every stage runs as
    an actual streaming query (readStream → writeStream), not a batch.
  pipeline: |
    event stream ──readStream──▶ watermark + window ──▶ revenue / active-users per window ──max──▶ 🔔 peak window
