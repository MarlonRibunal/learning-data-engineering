title: Count orders per status
order: 1
submission_path: projects/datamart-intelligence-platform/dbt/models/marts/orders_per_status.sql
scaffold: scaffold/orders_per_status.sql
solution: solution/orders_per_status.sql
reseed: projects/datamart-intelligence-platform/seeds/raw_seed.sql
checks:
  - type: dbt_test
    name: orders_per_status builds and passes its tests
    select: orders_per_status
    hints:
      - >-
        The model needs one row per order <em>status</em> with the number of
        orders in that status. A plain select of the orders rows gives you five
        rows, not one per status — what has to change?
      - >-
        Read from <code>{{ source('raw', 'orders') }}</code>, then
        <code>GROUP BY status</code> and <code>COUNT(*) AS order_count</code> so
        each status collapses to a single row.
      - >-
        <code>SELECT status, COUNT(*) AS order_count FROM {{ source('raw',
        'orders') }} GROUP BY status</code> — 3 rows (shipped 3, pending 1,
        cancelled 1) summing to 5 orders.
  - type: sql_assert
    name: one row per status
    query: "SELECT COUNT(*)::int FROM analytics_analytics.orders_per_status"
    equals: 3
  - type: sql_assert
    name: counts all five orders
    query: "SELECT SUM(order_count)::int FROM analytics_analytics.orders_per_status"
    equals: 5
    hint: "COUNT(*) per status; the seed has 5 orders total"
