title: "Streaming: dedupe replayed offsets"
order: 6
submission_path: submissions/streaming/dedupe_offsets.py
scaffold: scaffold/dedupe_offsets.py
solution: solution/dedupe_offsets.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: returns each offset once, in order
    entry: dedupe_offsets
    args:
      - [3, 1, 2, 1, 3]
    expect: [1, 2, 3]
    hints:
      - >-
        A replay can hand you the same offset more than once <em>and</em> out of
        order, but you must return each offset exactly once in ascending order.
        What two operations does that combine?
      - >-
        <code>set(offsets)</code> collapses the duplicates but throws away order;
        <code>sorted(...)</code> puts them back in ascending order. Compose the
        two so ordering is applied <em>after</em> deduping.
      - >-
        Return <code>sorted(set(offsets))</code>. For <code>[3, 1, 2, 1, 3]</code>
        that yields <code>[1, 2, 3]</code>.
