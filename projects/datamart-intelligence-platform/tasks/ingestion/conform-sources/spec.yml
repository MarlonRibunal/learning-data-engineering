title: "Ingestion: conform two sources into one"
order: 6
submission_path: submissions/ingestion/conform.sql
scaffold: scaffold/conform.sql
solution: solution/conform.sql
reseed: projects/datamart-intelligence-platform/seeds/conform_seed.sql
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: sql_ingest
    name: both feeds land in one conformed table
    asserts:
      - query: "SELECT COUNT(*)::int FROM raw.orders_all"
        equals: 4
        hint: "2 web orders + 2 store orders = 4"
      - query: "SELECT COUNT(*)::int FROM raw.orders_all WHERE source = 'web'"
        equals: 2
      - query: "SELECT COUNT(*)::int FROM raw.orders_all WHERE source = 'store'"
        equals: 2
        hint: "don't forget the store feed — and stamp source = 'store'"
      - query: "SELECT ROUND(SUM(amount))::int FROM raw.orders_all"
        equals: 210
        hint: "map store's `total` column onto the conformed `amount`"
    hints:
      - >-
        Only the web feed lands right now — the store orders never make it into
        <code>raw.orders_all</code>. How do you stack a <em>second</em> source
        onto the same target in one statement, tagging each row's origin?
      - >-
        <code>UNION ALL</code> concatenates two <code>SELECT</code>s of matching
        shape. The store feed has no <code>source</code> column and calls its
        money <code>total</code>, so select literals: <code>SELECT order_id,
        total, 'store' FROM landing.store_orders</code>.
      - >-
        Pair <code>SELECT order_id, amount, 'web' FROM landing.web_orders</code>
        with <code>UNION ALL SELECT order_id, total, 'store' FROM
        landing.store_orders</code> — 4 rows, 2 per source, summing to 210.
