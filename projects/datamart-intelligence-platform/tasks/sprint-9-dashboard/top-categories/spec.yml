title: "Dashboard: top categories bar chart"
order: 3
submission_path: submissions/dashboard/top_categories.py
scaffold: scaffold/top_categories.py
solution: solution/top_categories.py
checks:
  - type: file_exists
    name: submission exists and is non-empty
  - type: pyfunc
    name: ranks the top N categories by revenue
    entry: top_categories
    args:
      - - {order_id: 1, day: "2026-01-01", category: A, amount: 100}
        - {order_id: 2, day: "2026-01-01", category: B, amount: 20}
        - {order_id: 3, day: "2026-01-02", category: A, amount: 30}
        - {order_id: 4, day: "2026-01-02", category: A, amount: 5}
        - {order_id: 5, day: "2026-01-03", category: B, amount: 15}
      - 2
    expect:
      - {category: A, revenue: 135}
      - {category: B, revenue: 35}
    hints:
      - >-
        First roll the rows up into one revenue total per <em>category</em>, then
        keep only the <code>n</code> biggest. How do you sort a mapping by its
        values from largest to smallest?
      - >-
        Aggregate into a dict, then <code>sorted(totals.items(), key=lambda kv:
        kv[1], reverse=True)[:n]</code> orders categories by revenue descending and
        keeps the top <code>n</code>.
      - >-
        Return <code>[{"category": c, "revenue": v} for c, v in ranked[:n]]</code>;
        A's three rows sum to 135 and B's to 35, so with <code>n=2</code> you get
        <code>[{"category": "A", "revenue": 135}, {"category": "B", "revenue":
        35}]</code>.
