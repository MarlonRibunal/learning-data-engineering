version: 2

models:
  - name: revenue_by_status
    description: "Total revenue per order status (sprint-2-dbt exercise)."
    columns:
      - name: status
        description: "Order status — one row each."
        tests:
          - not_null
          - unique
      - name: revenue
        description: "Total revenue for the status."
        tests:
          - not_null

  - name: orders_per_status
    description: "Number of orders per status (sprint-2-dbt exercise)."
    columns:
      - name: status
        tests: [not_null, unique]
      - name: order_count
        tests: [not_null]

  - name: avg_order_value
    description: "Average order value per status (sprint-2-dbt exercise)."
    columns:
      - name: status
        tests: [not_null, unique]
      - name: avg_amount
        tests: [not_null]
