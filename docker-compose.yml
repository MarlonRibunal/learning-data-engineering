x-airflow-common: &airflow-common
  build:
    context: ./containers/airflow
    dockerfile: Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/datamart
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  volumes:
    - ./projects/datamart-intelligence-platform/dags:/opt/airflow/dags
    - ./projects/datamart-intelligence-platform/scripts:/opt/airflow/scripts
    - ./config:/opt/airflow/config
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: datamart
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Airflow: init runs once, then webserver + scheduler ----
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db init &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin
        --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ---- dbt: long-running container for `docker-compose exec dbt-service dbt run` ----
  dbt-service:
    build:
      context: ./containers/dbt
      dockerfile: Dockerfile
    volumes:
      - ./projects/datamart-intelligence-platform/dbt:/usr/app/dbt
      - ./config:/usr/app/config
    environment:
      DBT_PROFILES_DIR: /usr/app/config
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      postgres:
        condition: service_healthy

  # ---- dbt docs: the project's lineage graph + model/test/source catalog ----
  dbt-docs:
    build:
      context: ./containers/dbt
      dockerfile: Dockerfile
    volumes:
      - ./projects/datamart-intelligence-platform/dbt:/usr/app/dbt
      - ./config:/usr/app/config
    environment:
      DBT_PROFILES_DIR: /usr/app/config
      POSTGRES_HOST: postgres
    command:
      - bash
      - -lc
      - "cd /usr/app/dbt && (dbt docs generate || true) && python -m http.server 8084 --bind 0.0.0.0 --directory target"
    ports: ["8084:8084"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # NOTE: port 8501 belongs to the learning app (the lesson-runner). It is
  # host-run by `./platform.sh` (it imports the grader and drives these
  # containers via `docker compose exec`), or bundled in the single study
  # image — so it is deliberately NOT a compose service here.

  # ---- BI Dashboard & Builder: real Streamlit + Plotly over the warehouse ----
  dashboard:
    build:
      context: ./containers/dashboard
      dockerfile: Dockerfile
    volumes:
      - ./projects/datamart-intelligence-platform/dashboard:/app
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: airflow
      PGPASSWORD: airflow
      PGDATABASE: datamart
    ports: ["8083:8501"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ---- PGAdmin: Postgres UI ----
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@datamart.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports: ["8081:80"]
    volumes: [pgadmin_data:/var/lib/pgadmin]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Redpanda: Kafka-compatible streaming broker ----
  redpanda:
    image: redpandadata/redpanda:v23.2.14
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes: [redpanda_data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---- Redpanda Console: streaming UI ----
  redpanda-console:
    image: redpandadata/console:v2.3.1
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports: ["8082:8080"]
    restart: unless-stopped
    depends_on:
      - redpanda

volumes:
  postgres_data:
  pgadmin_data:
  redpanda_data:
